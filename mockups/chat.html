<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat y Negociación - C2C Streetwear</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="chat-body" data-page="chat">

  <div id="app-header"></div>

  <div class="chat-container">
    <!-- Lista de chats -->
    <aside class="chat-sidebar">
      <div class="sidebar-header">Mensajes</div>
      <div id="threads"></div>
    </aside>

    <!-- Chat -->
    <main class="chat-main">
      <div class="role-bar">
        <span class="muted">Vista del mockup:</span>
        <div class="role-switch">
          <button id="r-seller">Vendedor</button>
          <button id="r-buyer">Comprador</button>
        </div>
      </div>

      <div class="article-context">
        <div class="article-info">
          <a href="#" id="art-link"><img id="art-img" src="" alt="Artículo"></a>
          <div class="article-details">
            <h3 id="art-title"></h3>
            <p id="art-meta"></p>
            <p id="art-with" style="color:var(--ok);font-weight:bold;font-size:12px"></p>
          </div>
        </div>
        <div class="transaction-panel" id="panel"></div>
      </div>

      <div class="stepper-status" id="status"></div>

      <div class="chat-messages" id="msgs"></div>

      <div class="quick" id="quick"></div>
      <form class="chat-input" id="form">
        <input type="text" id="text" placeholder="Escribe un mensaje..." autocomplete="off">
        <button class="send" type="submit">Enviar</button>
      </form>
    </main>
  </div>

  <!-- Modal confirmación de venta -->
  <div class="modal-bg" id="modal">
    <div class="modal">
      <h3>Confirmar venta</h3>
      <div class="row"><span>Artículo</span><b id="m-title"></b></div>
      <div class="row"><span>Comprador</span><b id="m-buyer"></b></div>
      <div class="row"><span>Cantidad</span><b id="m-qty"></b></div>
      <div class="row"><span>Precio unitario acordado</span><b id="m-unit"></b></div>
      <div class="row total"><span>Total</span><span id="m-total"></span></div>
      <p class="muted" style="font-size:12px;margin-top:10px">Al confirmar, se registra la venta y se descuenta la cantidad del stock. Esta acción no se puede deshacer.</p>
      <div class="btns">
        <button class="btn secondary" id="m-cancel">Cancelar</button>
        <button class="btn accent" id="m-ok">Confirmar venta</button>
      </div>
    </div>
  </div>
  
  <!-- Modal Calificar Vendedor -->
  <div class="modal-bg" id="modal-rate">
    <div class="modal">
      <h3 style="text-align:center;">Calificar a <span id="rate-seller"></span></h3>
      <div class="star-rating">
        <input type="radio" id="s5" name="stars" value="5"><label for="s5">★</label>
        <input type="radio" id="s4" name="stars" value="4"><label for="s4">★</label>
        <input type="radio" id="s3" name="stars" value="3"><label for="s3">★</label>
        <input type="radio" id="s2" name="stars" value="2"><label for="s2">★</label>
        <input type="radio" id="s1" name="stars" value="1"><label for="s1">★</label>
      </div>
      <textarea id="rate-comment" class="modal-textarea" placeholder="Deja un comentario sobre tu experiencia (opcional)..."></textarea>
      <div class="btns">
        <button class="btn secondary" id="rate-cancel">Cancelar</button>
        <button class="btn accent" id="rate-ok">Enviar Valoración</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    renderHeader('chat');
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);

    const T = {
      1: { buyer: '@JuanComprador', status: 'acordado', agreed: 110000, stock: 2, msgs: [
        { from: 'buyer', time: 'Ayer, 18:45', text: 'Hola, estoy muy interesado en las zapatillas. ¿Aún tienes stock?' },
        { from: 'seller', time: 'Ayer, 18:50', text: 'Hola Juan, sí, me quedan 2 pares disponibles.' },
        { from: 'buyer', time: 'Hoy, 09:15', text: 'Perfecto. ¿Haces entregas en estación de metro? Te compraría un par si las dejas en $110.000.' },
        { from: 'buyer', time: 'Hoy, 09:15', offer: 110000, state: 'accepted' },
        { from: 'seller', time: 'Hoy, 09:20', text: 'Dale, me parece un trato justo. Te entrego mañana en Baquedano. Confirmaré la venta por el sistema para separar tu par.' }
      ]},
      2: { buyer: '@MatiStreet', status: 'negociando', agreed: null, stock: 1, msgs: [
        { from: 'buyer', time: 'Hoy, 10:02', text: 'Hola! ¿Está disponible el polerón? ¿Tienes más fotos?' },
        { from: 'seller', time: 'Hoy, 10:10', text: 'Sí, está disponible y nuevo con etiquetas. Te mando más fotos en un rato.' }
      ]},
      3: { buyer: '@JuanComprador', status: 'negociando', agreed: null, stock: 1, msgs: [
        { from: 'buyer', time: 'Hoy, 11:30', text: 'Buenas, ¿tienes boleta de las Jordan?' }
      ]},
      4: { buyer: '@CataColeccionista', status: 'negociando', agreed: null, stock: 3, msgs: [
        { from: 'buyer', time: 'Hoy, 12:00', text: 'Hola, me interesa la gorra. ¿Aceptas $60.000?' }
      ]}
    };

    const startId = params.get('id') && T[params.get('id')] ? Number(params.get('id')) : 1;
    let cur = startId;
    let role = params.get('id') ? 'buyer' : 'seller';
    let qtyAgreed = 1;

    const pr = () => getProduct(cur);
    const th = () => T[cur];
    const counterpart = () => role === 'seller' ? th().buyer : pr().seller;
    const now = () => new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });

    function renderThreads() {
      $('threads').innerHTML = Object.keys(T).map(id => {
        const p = getProduct(id), t = T[id];
        const who = role === 'seller' ? t.buyer : p.seller;
        const label = { negociando: 'Negociando', acordado: 'Acuerdo cerrado', vendido: 'Vendido' }[t.status];
        return `<div class="chat-item ${Number(id) === cur ? 'active' : ''}" data-t="${id}">
          <img src="${p.img}" alt="${p.title}">
          <div><h4>${who}</h4><p>${p.brand} ${p.title}</p><span class="st">${label}</span></div>
        </div>`;
      }).join('');
    }

    function renderHead() {
      const p = pr(), t = th();
      $('art-img').src = p.img; $('art-link').href = 'producto.html?id=' + p.id;
      $('art-title').textContent = p.brand + ' ' + p.title;
      $('art-meta').textContent = `Precio: ${fmt(p.price)} | Stock actual: ${t.stock} | Talla: ${p.size}`;
      $('art-with').textContent = 'Chat con ' + counterpart();
      $('r-seller').classList.toggle('on', role === 'seller');
      $('r-buyer').classList.toggle('on', role === 'buyer');
    }

    function renderStatus() {
      const order = ['negociando', 'acordado', 'vendido'];
      const labels = ['1 · Negociando', '2 · Precio acordado', '3 · Venta confirmada'];
      const i = order.indexOf(th().status);
      $('status').innerHTML = labels.map((l, k) => `<span class="step ${k <= i ? 'done' : ''}">${l}</span>${k < 2 ? '<span class="line"></span>' : ''}`).join('');
    }

    function renderPanel() {
      const t = th(), p = pr(), panel = $('panel');
      if (t.status === 'vendido') {
        panel.innerHTML = role === 'seller'
          ? `<span class="tag ok">✓ Venta registrada</span><a class="btn small secondary" href="catalogo.html">Volver al catálogo</a>`
          : `<span class="tag ok">✓ Compra confirmada</span><button class="btn small accent" id="rate">Calificar vendedor</button>`;
        const r = $('rate'); 
        if (r) r.onclick = () => {
           $('rate-seller').textContent = pr().seller;
           $('modal-rate').classList.add('open');
        };
        return;
      }
      if (role === 'seller') {
        const price = t.agreed || p.price;
        panel.innerHTML = `
          <label>Cant. acordada:</label>
          <input type="number" id="p-qty" value="${Math.min(qtyAgreed, t.stock)}" min="1" max="${t.stock}" title="Cantidad a descontar del stock">
          <label>Precio c/u:</label>
          <input type="number" id="p-price" value="${price}" step="1000" style="width:100px">
          <button class="btn small" id="p-sell">Marcar como Vendido</button>`;
        $('p-qty').oninput = (e) => { qtyAgreed = Math.max(1, Math.min(t.stock, +e.target.value || 1)); };
        $('p-sell').onclick = openModal;
      } else {
        panel.innerHTML = `
          <label>Mi oferta:</label>
          <input type="number" id="p-offer" value="${t.agreed || Math.round(p.price * .9 / 1000) * 1000}" step="1000" style="width:100px">
          <button class="btn small" id="p-send-offer">Enviar oferta</button>`;
        $('p-send-offer').onclick = () => {
          const v = +$('p-offer').value; if (!v) return;
          t.msgs.push({ from: 'buyer', time: now(), offer: v, state: 'pending' });
          renderMsgs();
        };
      }
    }

    function renderMsgs() {
      const t = th();
      $('msgs').innerHTML = t.msgs.map((m, i) => {
        if (m.system) return `<div class="message msg-system">${m.text}<span class="time">${m.time}</span></div>`;
        const mine = m.from === role;
        if (m.offer) {
          const st = { pending: 'Pendiente de respuesta', accepted: '✓ Oferta aceptada', rejected: 'Oferta rechazada' }[m.state];
          const canReply = role === 'seller' && m.from === 'buyer' && m.state === 'pending' && t.status !== 'vendido';
          return `<div class="offer-card" style="align-self:${mine ? 'flex-end' : 'flex-start'}">
            ${mine ? 'Tu oferta' : 'Oferta de ' + (m.from === 'buyer' ? t.buyer : pr().seller)}
            <b>${fmt(m.offer)}</b><span class="muted">${st}</span>
            ${canReply ? `<div style="display:flex;gap:6px;margin-top:8px"><button class="btn small" data-accept="${i}">Aceptar</button><button class="btn small secondary" data-reject="${i}">Rechazar</button></div>` : ''}
            <span class="time muted" style="display:block;font-size:10px;margin-top:4px">${m.time}</span></div>`;
        }
        return `<div class="message ${mine ? 'msg-sent' : 'msg-received'}">${m.text}<span class="time">${m.time}</span></div>`;
      }).join('');
      $('msgs').scrollTop = $('msgs').scrollHeight;
    }

    function renderQuick() {
      const sets = {
        seller: ['¿Te acomoda entregar en metro?', 'Te dejo el último precio', 'Sigue disponible'],
        buyer: ['¿Sigue disponible?', '¿Dónde haces la entrega?', '¿Tienes más fotos?']
      };
      $('quick').innerHTML = th().status === 'vendido' ? '' : sets[role].map(s => `<button type="button" data-q="${s}">${s}</button>`).join('');
    }

    function renderAll() { renderThreads(); renderHead(); renderStatus(); renderPanel(); renderMsgs(); renderQuick(); }

    function send(text) {
      if (!text.trim()) return;
      th().msgs.push({ from: role, time: now(), text: text.trim() });
      renderMsgs();
    }

    /* Modal Venta */
    function openModal() {
      const t = th(), p = pr();
      const q = Math.max(1, Math.min(t.stock, +$('p-qty').value || 1)), u = +$('p-price').value || p.price;
      $('m-title').textContent = p.brand + ' ' + p.title; $('m-buyer').textContent = t.buyer;
      $('m-qty').textContent = q; $('m-unit').textContent = fmt(u); $('m-total').textContent = fmt(q * u);
      $('modal').dataset.q = q; $('modal').dataset.u = u;
      $('modal').classList.add('open');
    }
    $('m-cancel').onclick = () => $('modal').classList.remove('open');
    $('m-ok').onclick = () => {
      const t = th(), q = +$('modal').dataset.q, u = +$('modal').dataset.u;
      t.stock -= q; t.status = 'vendido'; t.agreed = u;
      t.msgs.push({ system: true, time: now(), text: `✓ Venta confirmada: ${q} × ${fmt(u)} = <b>${fmt(q * u)}</b>. Stock restante: ${t.stock}.` });
      $('modal').classList.remove('open');
      toast('Venta registrada y stock actualizado');
      renderAll();
    };
    
    /* Modal Calificar */
    $('rate-cancel').onclick = () => {
      $('modal-rate').classList.remove('open');
    };
    $('rate-ok').onclick = () => {
      const starEl = document.querySelector('input[name="stars"]:checked');
      if (!starEl) return toast('Por favor selecciona una puntuación de 1 a 5 estrellas');
      
      const comment = $('rate-comment').value;
      Moderation.saveReview(pr().seller, parseInt(starEl.value), comment);
      
      $('modal-rate').classList.remove('open');
      $('rate').style.display = 'none'; 
      toast('¡Gracias por tu valoración!');
    };

    /* Eventos */
    document.addEventListener('click', (e) => {
      const t = e.target;
      if (t.closest('[data-t]')) { cur = Number(t.closest('[data-t]').dataset.t); qtyAgreed = 1; renderAll(); }
      if (t.dataset.q) send(t.dataset.q);
      if (t.dataset.accept) {
        const m = th().msgs[t.dataset.accept]; m.state = 'accepted'; th().status = 'acordado'; th().agreed = m.offer;
        th().msgs.push({ from: 'seller', time: now(), text: `Acepto ${fmt(m.offer)}. Coordinemos la entrega.` }); renderAll();
      }
      if (t.dataset.reject) {
        th().msgs[t.dataset.reject].state = 'rejected';
        th().msgs.push({ from: 'seller', time: now(), text: 'Gracias por la oferta, pero no alcanzo a bajar tanto el precio.' }); renderAll();
      }
    });
    $('form').addEventListener('submit', (e) => { e.preventDefault(); send($('text').value); $('text').value = ''; });
    $('r-seller').onclick = () => { role = 'seller'; renderAll(); };
    $('r-buyer').onclick = () => { role = 'buyer'; renderAll(); };

    renderAll();
  </script>
</body>
</html>
