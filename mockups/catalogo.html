<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - C2C Streetwear</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="catalogo">

  <div id="app-header"></div>

  <div class="container">
    <!-- Filtros -->
    <aside class="sidebar">
      <div class="filter-group">
        <h3>Rango de Precio</h3>
        <div class="price-inputs">
          <div class="field"><span>Mínimo</span><input type="number" id="input-min" value="0" min="0" max="250000" step="5000"></div>
          <div class="sep">-</div>
          <div class="field"><span>Máximo</span><input type="number" id="input-max" value="250000" min="0" max="250000" step="5000"></div>
        </div>
        <div class="range-wrap">
          <div class="track"></div>
          <div class="progress" id="range-color"></div>
          <input type="range" id="range-min" min="0" max="250000" value="0" step="5000">
          <input type="range" id="range-max" min="0" max="250000" value="250000" step="5000">
        </div>
      </div>

      <div class="filter-group" id="f-cat">
        <h3>Categoría (Obligatorio)</h3>
        <label><input type="checkbox" value="Zapatillas" checked> Zapatillas</label>
        <label><input type="checkbox" value="Polerones" checked> Polerones</label>
        <label><input type="checkbox" value="Gorros" checked> Gorros</label>
      </div>

      <div class="filter-group" id="f-size">
        <h3>Talla</h3>
        <label><input type="checkbox" value="S"> US 8 / S</label>
        <label><input type="checkbox" value="M"> US 9 / M</label>
        <label><input type="checkbox" value="L"> US 10 / L</label>
        <label><input type="checkbox" value="Única"> Talla única</label>
      </div>
      
      <div class="filter-group" id="f-brand">
        <h3>Marca</h3>
        <label><input type="checkbox" value="Nike"> Nike</label>
        <label><input type="checkbox" value="Jordan"> Jordan</label>
        <label><input type="checkbox" value="Stüssy"> Stüssy</label>
        <label><input type="checkbox" value="Supreme"> Supreme</label>
      </div>

      <div class="filter-group" id="f-cond">
        <h3>Estado</h3>
        <label><input type="radio" name="estado" value="" checked> Todos</label>
        <label><input type="radio" name="estado" value="Nuevo"> Nuevo</label>
        <label><input type="radio" name="estado" value="Usado"> Usado</label>
      </div>

      <button class="btn block" id="apply">Aplicar Filtros</button>
      <button class="link-btn" id="clear" style="margin-top:10px;display:block;">Limpiar filtros</button>
    </aside>

    <section>
      <div class="toolbar">
        <span id="count" class="muted"></span>
        <select id="sort">
          <option value="">Ordenar: Relevancia</option>
          <option value="asc">Precio: menor a mayor</option>
          <option value="desc">Precio: mayor a menor</option>
        </select>
      </div>
      <main class="catalog-grid" id="grid"></main>
    </section>
  </div>

  <script src="data.js"></script>
  <script>
    renderHeader('catalogo');

    const $ = (id) => document.getElementById(id);
    const q = (new URLSearchParams(location.search).get('q') || '').toLowerCase();
    if (q) document.querySelector('.search-bar input').value = q;

    const minR = $('range-min'), maxR = $('range-max'), minI = $('input-min'), maxI = $('input-max'), bar = $('range-color');
    const MAX = 250000;

    function syncBar() {
      bar.style.left = (minR.value / MAX * 100) + '%';
      bar.style.right = (100 - maxR.value / MAX * 100) + '%';
    }
    function fromRange(changed) {
      if (+minR.value > +maxR.value) { if (changed === 'min') minR.value = maxR.value; else maxR.value = minR.value; }
      minI.value = minR.value; maxI.value = maxR.value; syncBar();
    }
    function fromInput() {
      minR.value = Math.min(+minI.value || 0, +maxI.value || MAX);
      maxR.value = Math.max(+maxI.value || 0, +minI.value || 0);
      syncBar();
    }
    minR.addEventListener('input', () => fromRange('min'));
    maxR.addEventListener('input', () => fromRange('max'));
    minI.addEventListener('change', fromInput);
    maxI.addEventListener('change', fromInput);

    function checked(sel) { return [...document.querySelectorAll(sel + ' input:checked')].map(i => i.value); }

    function render() {
      const cats = checked('#f-cat');
      const sizes = checked('#f-size');
      const brands = checked('#f-brand');
      const cond = document.querySelector('input[name=estado]:checked').value;
      const lo = +minR.value, hi = +maxR.value;

      if (cats.length === 0) {
        $('count').textContent = '0 artículos';
        $('grid').innerHTML = '<div class="empty" style="color: var(--danger); border-color: var(--danger);">⚠ Selecciona al menos una Categoría (Filtro Obligatorio) para ver los resultados.</div>';
        return; 
      }

      let list = PRODUCTS.filter(p =>
        p.price >= lo && p.price <= hi &&
        cats.includes(p.cat) &&
        (!sizes.length || sizes.includes(p.sizeGroup)) &&
        (!brands.length || brands.includes(p.brand)) &&
        (!cond || p.cond === cond) &&
        (!q || (p.title + ' ' + p.brand + ' ' + p.cat).toLowerCase().includes(q))
      );
      
      const s = $('sort').value;
      if (s) list.sort((a, b) => s === 'asc' ? a.price - b.price : b.price - a.price);
      
      $('count').textContent = list.length + (list.length === 1 ? ' artículo' : ' artículos');
      $('grid').innerHTML = list.length ? list.map(productCard).join('') : '<div class="empty">No encontramos artículos con esos filtros.</div>';
    }

    $('apply').addEventListener('click', render);
    $('sort').addEventListener('change', render);
    $('clear').addEventListener('click', () => {
      document.querySelectorAll('.sidebar input[type=checkbox]').forEach(c => c.checked = false);
      document.querySelector('input[name=estado][value=""]').checked = true;
      document.querySelectorAll('#f-cat input[type=checkbox]').forEach(c => c.checked = true);
      minR.value = 0; maxR.value = MAX; fromRange(); render();
    });

    syncBar(); render();
  </script>
</body>
</html>
