<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - C2C Streetwear</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">

  <div id="app-header"></div>

  <div class="auth-container">
    
    <!-- Caja de Inicio de Sesión (RF2) -->
    <div class="auth-box" id="box-login">
      <h2>Iniciar Sesión</h2>
      <form id="form-login">
        <div class="field">
          <label>Correo Electrónico</label>
          <input type="email" id="l-email" placeholder="ejemplo@correo.com" required>
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="l-pass" required>
        </div>
        <button type="submit" class="btn accent block">Ingresar a mi cuenta</button>
        <p class="switch-auth">¿No tienes cuenta? <a href="#" id="to-register">Regístrate aquí</a></p>
      </form>
    </div>

    <!-- Caja de Registro (RF1) -->
    <div class="auth-box" id="box-register" style="display:none;">
      <h2>Crear Cuenta</h2>
      <form id="form-register">
  <div class="field-row">
    <div class="field">
      <label for="r-n1">Primer nombre</label>
      <input type="text" id="r-n1" maxlength="50" required>
    </div>
    <div class="field">
      <label for="r-n2">Segundo nombre <small>(opcional)</small></label>
      <input type="text" id="r-n2" maxlength="50">
    </div>
  </div>
  <div class="field-row">
    <div class="field">
      <label for="r-a1">Primer apellido</label>
      <input type="text" id="r-a1" maxlength="50" required>
    </div>
    <div class="field">
      <label for="r-a2">Segundo apellido <small>(opcional)</small></label>
      <input type="text" id="r-a2" maxlength="50">
    </div>
  </div>
  <div class="field">
    <label for="r-user">@usuario</label>
    <input type="text" id="r-user" placeholder="@tuusuario" maxlength="30" required>
  </div>
  <div class="field">
    <label for="r-email">Correo Electrónico</label>
    <input type="email" id="r-email" placeholder="ejemplo@correo.com" required>
  </div>
  <div class="field">
    <label for="r-pass">Contraseña</label>
    <input type="password" id="r-pass" required>
  </div>
  <button type="submit" class="btn accent block">Registrarme</button>
  <p class="switch-auth">¿Ya tienes cuenta? <a href="#" id="to-login">Inicia sesión</a></p>
</form>
    </div>

  </div>

  <script src="data.js"></script>
  <script>
    renderHeader('login');
    const $ = (id) => document.getElementById(id);

    // Si ya está logueado, mandarlo al catálogo
    if (Auth.getUser()) window.location.href = 'catalogo.html';

    // Alternar vistas
    $('to-register').onclick = (e) => { e.preventDefault(); $('box-login').style.display = 'none'; $('box-register').style.display = 'block'; };
    $('to-login').onclick = (e) => { e.preventDefault(); $('box-register').style.display = 'none'; $('box-login').style.display = 'block'; };

    // Manejar Login
    $('form-login').onsubmit = (e) => {
      e.preventDefault();
      const ok = Auth.login($('l-email').value, $('l-pass').value);
      if (ok) {
        toast('Bienvenido nuevamente');
        setTimeout(() => window.location.href = 'catalogo.html', 800);
      } else {
        toast('Correo o contraseña incorrectos');
      }
    };

    // Manejar Registro
    $('form-register').onsubmit = (e) => {
  e.preventDefault();
  const res = Auth.register({
    nombre1:   $('r-n1').value.trim(),
    nombre2:   $('r-n2').value.trim(),
    apellido1: $('r-a1').value.trim(),
    apellido2: $('r-a2').value.trim(),
    username:  $('r-user').value,
    email:     $('r-email').value,
    pass:      $('r-pass').value
  });
  if (res.ok) {
    toast('Cuenta creada con éxito');
    setTimeout(() => window.location.href = 'perfil.html', 800);
  } else {
    toast(res.error);
  }
};
  </script>
</body>
</html>
